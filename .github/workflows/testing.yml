name: Pytest Testing

on: [push, workflow_dispatch]

permissions:
  contents: write
env:
  CESM_REPO: CROCODILE-CESM/CESM
  CESM_REF: full_regional_cesm
  CIME_MACHINE: ubuntu-latest
  USER: ${{ github.actor }}
jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      CESMROOT: ${{ github.workspace }}/CESM
      DIN_LOC_ROOT: ${{ github.workspace }}/cesm_data
      CIME_OUTPUT_ROOT: ${{ github.workspace }}/cesm_data
    steps:
      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The clone itself is cheap -- the expensive part is `git-fleximod
      # update`, which pulls in every CESM external (MOM6, CICE, CDEPS,
      # cime, ccs_config, ...). Cache the whole post-fleximod CESMROOT tree
      # so a cache hit skips both steps entirely.
      - name: Cache CESM checkout + externals
        id: cesm-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CESMROOT }}
          key: cesm-${{ runner.os }}-${{ env.CESM_REF }}-v2

      - name: Checkout CESM and run git-fleximod update
        if: steps.cesm-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch ${{ env.CESM_REF }} https://github.com/${{ env.CESM_REPO }} ${{ env.CESMROOT }}
          cd ${{ env.CESMROOT }}
          ./bin/git-fleximod update
          # visualCaseGen's CIME_interface stamps a compatibility check off
          # `git describe --tags` on this checkout (case creation reads it,
          # expects a `cimeN.M.P` tag). In CI, fleximod's checkout of `cime`
          # doesn't come with its own reachable tag (git -C cime fetch --tags
          # only pulls the *parent* CESM repo's unrelated tags here), so
          # describe fails outright. This CESM branch is documented (see
          # visualCaseGen/cime_interface.py) as shipping cime6.2.2 -- stamp
          # that tag directly if describe still can't find anything.
          git -C cime fetch --tags || true
          git -C cime describe --tags >/dev/null 2>&1 || git -C cime tag cime6.2.2

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: CrocoDash
          environment-file: environment.yml
          cache-environment: true
          cache-downloads: true
          # environment.yml only pins the top-level deps -- the editable
          # submodule installs (rm6, mom6_forge, visualCaseGen,
          # ipyfilechooser) declare their own dependencies in their own
          # pyproject.toml/setup.py/environment.yml. Fold those into the
          # cache key too, so a submodule dependency bump invalidates the
          # cached env instead of silently reusing a stale one.
          cache-environment-key: environment-${{ hashFiles('environment.yml', 'CrocoDash/rm6/pyproject.toml', 'CrocoDash/rm6/environment-ci.yml', 'CrocoDash/visualCaseGen/pyproject.toml', 'CrocoDash/visualCaseGen/environment.yml', 'CrocoDash/visualCaseGen/external/mom6_forge/pyproject.toml', 'CrocoDash/visualCaseGen/external/mom6_forge/environment.yml', 'CrocoDash/visualCaseGen/external/mom6_forge/setup.py', 'CrocoDash/visualCaseGen/external/ipyfilechooser/setup.py') }}

      - name: Run Pytest
        shell: bash -el {0}
        run: |
          pytest --ignore=CrocoDash/visualCaseGen --ignore=CrocoDash/rm6 -vv --tb=short --cov=CrocoDash --cov-report=xml --cov-branch --durations=10
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
         token: ${{ secrets.CODECOV_TOKEN }}
         slug: CROCODILE-CESM/CrocoDash
         files: coverage.xml

      - name: Run setup_case.py
        shell: bash -el {0}
        run: |
          copernicusmarine login \
            --username ${{ secrets.GLORYS_USERNAME }} \
            --password ${{ secrets.GLORYS_PASSWORD }}
          mkdir -p ${{ github.workspace }}/croc_cases
          mkdir -p ${{ github.workspace }}/croc_input
          python -u tests/generate_small_test_case.py \
            --cesmroot ${{ env.CESMROOT }} \
            --caseroot ${{ github.workspace }}/croc_cases \
            --inputdir ${{ github.workspace }}/croc_input \
            --casename actions_case \
            --machine ubuntu-latest \
            --project PLACEHOLDER \
            --forcing-fn get_glorys_data_script_for_cli

      - name: Bundle case with crocodash bundle
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        shell: bash -el {0}
        run: |
          mkdir -p ${{ github.workspace }}/bundle_output
          crocodash bundle \
            --caseroot ${{ github.workspace }}/croc_cases/actions_case \
            --output-dir ${{ github.workspace }}/bundle_output \
            --cesmroot ${{ env.CESMROOT }} \
            --machine ubuntu-latest \
            --project PLACEHOLDER
      - name: Upload bundle artifact
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: cesm-bundle-actions_case
          path: ${{ github.workspace }}/bundle_output
          retention-days: 1
  run_cesm_crocontainer:
    needs: pytest
    runs-on: gha-runner-crocodash
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read     # Allows checking out code
      packages: write    # Crucial: Allows authenticating with GHCR
    steps:
      - name: Install Apptainer
        run: |
          sudo apt update && sudo apt install -y software-properties-common
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt update
          sudo apt-get install -y apptainer

      - name: Download bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: cesm-bundle-actions_case
          path: ${{ github.workspace }}/bundle_output
      - name: Verify artifact
        run: ls -la ${{ github.workspace }}/bundle_output/
      - name: Build Sandbox Container
        env:
          APPTAINER_DOCKER_USERNAME: ${{ github.actor }}
          APPTAINER_DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          apptainer build --sandbox workspace_sandbox/ \
            docker://ghcr.io/crocodile-cesm/crocontainer:sha-4cfce86

      # Copy the current CrocoDash into the sandbox container to ensure the latest code is used
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          path: CrocoDash
      - name: Check if environment.yml changed
        id: compare
        run: |
          if diff workspace_sandbox/workspace/CrocoDash/environment.yml CrocoDash/environment.yml; then
            echo "No changes in environment.yml"
            echo "env_changed=false" >> $GITHUB_OUTPUT
          else
            echo "environment.yml changed!"
            echo "env_changed=true" >> $GITHUB_OUTPUT
          fi
      - name: Copy CrocoDash into container
        run: |
              rm -rf workspace_sandbox/workspace/CrocoDash
              cp -r CrocoDash workspace_sandbox/workspace/
      
        # This is warning that CIRRUS runners may not pull the most up-to-date image from crocontainer, you may need a new tag name. 
      - name: Run CESM
        run: |
          mkdir ${{ github.workspace }}/cesm_scratch
          apptainer exec \
            --writable \
            --env GIT_AUTHOR_NAME="${{ github.actor }}" \
            --env GIT_AUTHOR_EMAIL="${{ github.actor_id }}+${{ github.actor }}@github.com" \
            --env GIT_COMMITTER_NAME="${{ github.actor }}" \
            --env GIT_COMMITTER_EMAIL="${{ github.actor_id }}+${{ github.actor }}@github.com" \
            --bind /glade/campaign/cesm/cesmdata/inputdata:/root/cesm/inputdata \
            --bind ${{ github.workspace }}/cesm_scratch:/root/cesm/scratch \
            --bind ${{ github.workspace }}/bundle_output/actions_case_case_bundle:/workspace/bundle \
            workspace_sandbox/ \
            /bin/bash /workspace/run_case.sh
      - name: Upload CESM logs/data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cesm-${{ github.run_id }}
          path: |
            /home/runner/cesm/scratch/case/run/
            /home/runner/cesm/archive/case/
