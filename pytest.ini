# pytest.ini
[pytest]
addopts = --import-mode=importlib --ignore=CrocoDash/visualCaseGen
markers =
    slow: marks tests as slow (deselect with -m 'not slow')
    workflow: marks tests as workflow (deselect with -m 'not workflow')
    needs_forcing: domain test that needs bounding boxes or a full forcing
        pipeline; opts the module into per-domain xfails (see
        tests/fixtures/domains.py::select_domains)
pythonpath = .